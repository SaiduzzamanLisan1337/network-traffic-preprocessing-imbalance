[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-traffic-preprocessing-imbalance"
version = "1.0.0"
description = "Reproducible study of preprocessing and class-imbalance strategies for intrusion detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "imbalanced-learn>=0.12,<1",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
ids-imbalance = "network_imbalance.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
